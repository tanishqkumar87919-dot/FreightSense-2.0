services:
  - type: web
    name: freightsense-ml-api
    env: python
    rootDir: services/ml-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_INTERNAL_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEFAULT_MODEL_VERSION
        value: v2.5
